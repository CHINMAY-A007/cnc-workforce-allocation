<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC Workforce Allocation - Demo</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><span class="logo"><i class=ic-gear></i></span><div><b>Workforce Planner</b><small>Sample CNC Works, Bangalore<br>(demo data)</small></div></div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="rolebox">
      <label for="role">Demo role</label>
      <select id="role"></select>
      <small>Demo simulation of permissions for presentation only. This is not a real login.</small>
    </div>
  </aside>
  <main id="main">
    <header id="top">
      <button id="menu" aria-label="Menu"><i class=ic-menu></i></button>
      <div class="tags"><span class="tag">Simulated ERP</span><span class="tag">Demo data</span><span class="tag" id="clock"></span></div>
      <div class="topright">
        <button class="ghost" id="bell" title="Alerts"><i class=ic-bell></i> <span id="bellcount">0</span></button>
        <button class="ghost" id="guidebtn"><i class=ic-note></i> Demo script</button>
      </div>
    </header>
    <div id="banner"></div>
    <div id="page" tabindex="-1"></div>
  </main>
  <aside id="guide" class="hidden" aria-label="Demo script"></aside>
</div>
<div id="modal" class="hidden"><div class="modalbox" role="dialog" aria-modal="true"><button class="x" id="modalx" aria-label="Close">&times;</button><div id="modalbody"></div></div></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busytext">Working...</div></div>
<div id="toasts"></div>
<script src="/static/app.js?v=2"></script>
<script src="/static/pages2.js?v=2"></script>
</body>
</html>
