<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC Workforce Allocation (Demo)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css">
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; }
  .tab { display:none; }
  .tab.active { display:block; }
  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:600; }
  .b-green{background:#dafbe1;color:#1a7f37;} .b-amber{background:#fff8c5;color:#9a6700;}
  .b-red{background:#ffebe9;color:#cf222e;} .b-blue{background:#ddf4ff;color:#0969da;}
  .card { background:#fff; border:1px solid #d0d7de; border-radius:12px; padding:1rem 1.2rem; margin-bottom:0.8rem; }
  .metric { background:#f6f8fa; border-radius:10px; padding:0.6rem 0.8rem; }
</style>
</head>
<body class="bg-gray-50 text-gray-900">
<div class="max-w-6xl mx-auto p-4">
  <header class="flex items-center justify-between mb-4">
    <div>
      <h1 class="text-2xl font-bold">CNC Workforce Allocation</h1>
      <p class="text-sm text-gray-500">Sample CNC Works, Bangalore (demo data) &middot; Simulated ERP</p>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-sm text-gray-500">Role:</span>
      <select id="role" class="border rounded px-2 py-1">
        <option>Production Manager</option>
        <option>Engineer/Supervisor</option>
        <option>Worker</option>
        <option>HR/Workforce Admin</option>
        <option>ERP Administrator</option>
      </select>
      <span id="alertBadge" class="badge b-red">0</span>
    </div>
  </header>

  <nav class="flex flex-wrap gap-1 mb-4 border-b pb-2" id="tabs"></nav>

  <main id="content"></main>
</div>

<script>
const API = '';
let role = localStorage.getItem('role') || 'Production Manager';
document.getElementById('role').value = role;
document.getElementById('role').addEventListener('change', e => { role=e.target.value; localStorage.setItem('role',role); render(); });
function H(){ return {'X-Role': role, 'Content-Type':'application/json'}; }
async function get(p){ const r=await fetch(API+p,{headers:H()}); return r.json(); }
async function post(p,b){ const r=await fetch(API+p,{method:'POST',headers:H(),body:JSON.stringify(b||{})}); return r.json(); }

const TABS = [
  ['home','Home / Guided Demo'],
  ['orders','Orders and Tasks'],
  ['workforce','Workforce and Skill Matrix'],
  ['allocation','AI Allocation Proposal'],
  ['gantt','Schedule Gantt'],
  ['approval','Approval and Reassignment'],
  ['mytasks','My Tasks'],
  ['progress','Live Progress and Alerts'],
  ['reports','Reports'],
  ['audit','Audit and Settings'],
  ['requirements','Requirements Coverage'],
];
let activeTab = localStorage.getItem('tab') || 'home';
const nav = document.getElementById('tabs');
TABS.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=label; b.className='px-3 py-1 rounded text-sm '+(id===activeTab?'bg-blue-600 text-white':'bg-gray-200');
  b.onclick=()=>{activeTab=id; localStorage.setItem('tab',id); renderTabs(); render();};
  b.dataset.id=id; nav.appendChild(b);
});
function renderTabs(){
  nav.querySelectorAll('button').forEach(b=>{ b.className='px-3 py-1 rounded text-sm '+(b.dataset.id===activeTab?'bg-blue-600 text-white':'bg-gray-200'); });
}

const content = document.getElementById('content');
function show(html){ content.innerHTML = html; }

async function render(){
  renderTabs();
  switch(activeTab){
    case 'home': return renderHome();
    case 'orders': return renderOrders();
    case 'workforce': return renderWorkforce();
    case 'allocation': return renderAllocation();
    case 'gantt': return renderGantt();
    case 'approval': return renderApproval();
    case 'mytasks': return renderMyTasks();
    case 'progress': return renderProgress();
    case 'reports': return renderReports();
    case 'audit': return renderAudit();
    case 'requirements': return renderRequirements();
  }
}

// ---------- Home ----------
async function renderHome(){
  const alerts = await get('/api/alerts');
  document.getElementById('alertBadge').textContent = alerts.count;
  show(`
  <div class="card">
    <h2 class="text-xl font-bold mb-2">Home / Guided Demo</h2>
    <p class="text-gray-600 mb-4">5-step walkthrough for the Production Manager.</p>
    <div class="grid gap-3">
      ${[['1. Add Order','Create a production order or use seeded ones.','orders'],
         ['2. Generate Tasks','Tasks auto-created from the product routing.','orders'],
         ['3. Get AI Proposal','Run the solver for an optimized schedule.','allocation'],
         ['4. Review and Approve','Edit, lock, then approve.','approval'],
         ['5. Handle a Surprise','Simulate absence/breakdown and replan.','progress']].map(([t,d,tab])=>`
        <div class="card flex items-center justify-between">
          <div><div class="font-semibold">${t}</div><div class="text-sm text-gray-500">${d}</div></div>
          <button class="bg-blue-600 text-white px-3 py-1 rounded" onclick="goTab('${tab}')">Open</button>
        </div>`).join('')}
    </div>
    <div class="mt-4 flex gap-2">
      <button class="bg-green-600 text-white px-4 py-2 rounded" onclick="resetDemo()">Load / Reset demo data</button>
      <button class="bg-gray-200 px-4 py-2 rounded" onclick="goTab('orders')">Open Orders</button>
      <button class="bg-gray-200 px-4 py-2 rounded" onclick="goTab('allocation')">Open Allocation</button>
    </div>
  </div>`);
}
function goTab(t){ activeTab=t; localStorage.setItem('tab',t); renderTabs(); render(); }
async function resetDemo(){ await post('/api/reset',{}); alert('Demo data reset.'); render(); }

// ---------- Orders ----------
async function renderOrders(){
  const orders = await get('/api/orders');
  const products = await get('/api/products');
  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">Orders and Tasks</h2>
    <p class="text-gray-600 mb-3">Read orders from the Simulated ERP, create new orders, auto-generate tasks from routing.</p>
    <h3 class="font-semibold mb-2">Orders (Simulated ERP)</h3>
    <div class="overflow-x-auto"><table class="w-full text-sm border">
      <thead class="bg-gray-100"><tr><th class="p-2">ID</th><th class="p-2">Product</th><th class="p-2">Qty</th><th class="p-2">Priority</th><th class="p-2">Due</th><th class="p-2">Status</th></tr></thead>
      <tbody>${orders.map(o=>`<tr class="border-t"><td class="p-2">${o.id}</td><td class="p-2">${o.product_name}</td><td class="p-2">${o.quantity}</td><td class="p-2">${o.priority}</td><td class="p-2">${o.due_date}</td><td class="p-2">${o.status}</td></tr>`).join('')}</tbody>
    </table></div></div>`;

  html += `<div class="card"><h3 class="font-semibold mb-2">New Order</h3>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="text-sm">Product</label><select id="np_prod" class="border rounded w-full p-1">${products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <div><label class="text-sm">Quantity</label><input id="np_qty" type="number" value="10" class="border rounded w-full p-1"></div>
      <div><label class="text-sm">Due date</label><input id="np_due" type="date" class="border rounded w-full p-1"></div>
      <div><label class="text-sm">Priority</label><select id="np_prio" class="border rounded w-full p-1"><option>Urgent</option><option>High</option><option selected>Normal</option></select></div>
      <div class="col-span-2"><label class="text-sm">Customer commitment</label><input id="np_cust" value="Demo customer" class="border rounded w-full p-1"></div>
      <div class="col-span-2"><label class="text-sm">Free-text notes (keyword + AI parser)</label><textarea id="np_notes" class="border rounded w-full p-1" rows="2"></textarea></div>
    </div>
    <button class="mt-3 bg-blue-600 text-white px-4 py-2 rounded" onclick="createOrder()">Create Order</button>
    <div id="noteResult" class="mt-2 text-sm"></div>
  </div>`;

  // tasks view
  html += `<div class="card"><h3 class="font-semibold mb-2">Tasks</h3>
    <div class="flex gap-2 mb-2"><select id="taskOrder" class="border rounded p-1"><option value="">All</option>${orders.map(o=>`<option value="${o.id}">${o.id}</option>`).join('')}</select>
    <button class="bg-gray-200 px-3 py-1 rounded" onclick="loadTasks()">Load</button></div>
    <div id="taskTable"></div></div>`;
  show(html);
  loadTasks();
}

async function createOrder(){
  const body = {
    product_id: document.getElementById('np_prod').value,
    quantity: parseInt(document.getElementById('np_qty').value),
    due_date: document.getElementById('np_due').value,
    priority: document.getElementById('np_prio').value,
    customer_commitment: document.getElementById('np_cust').value,
    notes: document.getElementById('np_notes').value,
  };
  const res = await post('/api/orders', body);
  let msg = `Order ${res.order_id} created. Tasks generated.`;
  if (res.parsed_notes) {
    const p = res.parsed_notes;
    msg += `<br><b>Parser (${p.source}):</b> skills=${p.skills.join(', ')||'none'}, certs=${p.certs.join(', ')||'none'}, notes=${p.notes.join(', ')||'none'}`;
    if (p.rejected && p.rejected.length) msg += `<br>Rejected/unmatched: ${p.rejected.join(', ')}`;
    msg += `<br><span class="text-amber-700">Parser is ${p.source==='keyword'?'keyword matching only (may miss phrasings)':'AI-assisted, validated against known skills'}.</span>`;
  }
  document.getElementById('noteResult').innerHTML = msg;
  await renderOrders();
}

async function loadTasks(){
  const oid = document.getElementById('taskOrder').value;
  const url = oid ? '/api/tasks?order_id='+oid : '/api/tasks';
  const tasks = await get(url);
  const div = document.getElementById('taskTable');
  if (!tasks.length){ div.innerHTML='<p class="text-gray-500">No tasks.</p>'; return; }
  div.innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm border">
    <thead class="bg-gray-100"><tr><th class="p-2">ID</th><th class="p-2">Name</th><th class="p-2">Dur(min)</th><th class="p-2">Skill</th><th class="p-2">Lvl</th><th class="p-2">Role</th><th class="p-2">WC</th><th class="p-2">Deps</th></tr></thead>
    <tbody>${tasks.map(t=>`<tr class="border-t"><td class="p-2">${t.id}</td><td class="p-2">${t.name}</td><td class="p-2">${t.duration_min}</td><td class="p-2">${t.required_skill}</td><td class="p-2">${t.min_level}</td><td class="p-2">${t.required_role}</td><td class="p-2">${t.work_center_kind}</td><td class="p-2">${(t.depends_on||[]).join(', ')}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">Workforce and Skill Matrix</h2>
    <p class="text-gray-600 mb-3">Workforce master, skill matrix heatmap, certification expiry flags. Editable by HR role.</p>
    <h3 class="font-semibold mb-2">Workforce Master</h3>
    <div class="overflow-x-auto"><table class="w-full text-sm border">
      <thead class="bg-gray-100"><tr><th class="p-2">ID</th><th class="p-2">Name</th><th class="p-2">Role</th><th class="p-2">Team</th><th class="p-2">Shift</th><th class="p-2">MaxHrs</th><th class="p-2">OT</th><th class="p-2">Active</th></tr></thead>
      <tbody>${emps.map(e=>`<tr class="border-t"><td class="p-2">${e.id}</td><td class="p-2">${e.name}</td><td class="p-2">${e.role}</td><td class="p-2">${e.team}</td><td class="p-2">${e.shift}</td><td class="p-2">${e.max_daily_hours}</td><td class="p-2">${e.overtime_cap_hours}</td><td class="p-2">${e.active?'Yes':'No'}</td></tr>`).join('')}</tbody>

  // skill matrix heatmap
  html += `<div class="card"><h3 class="font-semibold mb-2">Skill Matrix (employees x skills)</h3>
    <div class="overflow-x-auto"><table class="text-xs border">
      <thead><tr><th class="p-1">Employee</th>${skills.map(s=>`<th class="p-1">${s}</th>`).join('')}</tr></thead>
      <tbody>${emps.map(e=>`<tr><td class="p-1 font-medium">${e.name}</td>${skills.map(s=>{const lvl=matrix[e.id][s];const bg=lvl>=4?'#1a7f37':lvl>=2?'#0969da':lvl>0?'#9a6700':'#eaeef2';return `<td class="p-1 text-center" style="background:${bg};color:#fff">${lvl}</td>`;}).join('')}</tr>`).join('')}</tbody>

  // certs

  html += `<div class="card"><h3 class="font-semibold mb-2">Certification Expiry Flags</h3><p class="text-sm text-gray-500">See workforce data; expired certs exclude employees from eligible tasks.</p></div>`;

// ---------- Allocation ----------
async function renderAllocation(){
  const orders = await get('/api/orders');
  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">AI Allocation Proposal</h2>
    <p class="text-gray-600 mb-3">Choose objectives, generate an optimized schedule, review assignments with reasons.</p>
    <h3 class="font-semibold mb-2">Objective preset</h3>
    <div class="flex gap-2 mb-2">
      <select id="preset" class="border rounded p-1"><option>Balanced</option><option>Rush mode</option><option>Cost saver</option></select>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-3">
      ${['on_time','overtime','balance','makespan','reassignment','continuity'].map(w=>`
        <div><label class="text-xs">${w}</label><input id="w_${w}" type="number" step="0.5" value="${w==='on_time'?10:w==='overtime'?3:w==='balance'?2:w==='makespan'?1:w==='reassignment'?2:2}" class="border rounded w-full p-1"></div>`).join('')}
    </div>
    <div class="mb-3"><label class="text-sm">Orders to schedule</label>
      <select id="allocOrders" multiple class="border rounded w-full p-1" size="4">${orders.map(o=>`<option value="${o.id}" selected>${o.id} - ${o.product_name}</option>`).join('')}</select>
    </div>
    <button class="bg-blue-600 text-white px-4 py-2 rounded" onclick="generateSchedule()">Generate Schedule</button>
    <div id="solveResult" class="mt-3"></div>
  </div>
  <div id="assignTable"></div>
  <div id="whyPanel" class="card hidden"></div>
  <div id="conflictPanel" class="card hidden"></div>`;
  show(html);
}

async function generateSchedule(){
  const weights = {};
  ['on_time','overtime','balance','makespan','reassignment','continuity'].forEach(w=>{ weights[w]=parseFloat(document.getElementById('w_'+w).value); });
  const sel = Array.from(document.getElementById('allocOrders').selectedOptions).map(o=>o.value);
  const res = await post('/api/solve', {weights, orders: sel});
  let msg = `Solver: <b>${res.status}</b> in ${res.runtime.toFixed(2)}s`;
  if (res.violations && res.violations.length) msg += `<br><span class="text-red-600">Violations: ${res.violations.join('; ')}</span>`;
  else if (res.status==='OPTIMAL'||res.status==='FEASIBLE') msg += `<br><span class="text-green-600">No hard-constraint violations.</span>`;
  if (res.zero_eligibility && res.zero_eligibility.length) msg += `<br><span class="text-red-600">Zero-eligibility tasks: ${res.zero_eligibility.join(', ')}</span>`;
  document.getElementById('solveResult').innerHTML = msg;

  if (res.assignments && res.assignments.length){
    const rows = res.assignments.map(a=>`<tr class="border-t"><td class="p-2">${a.task_id}</td><td class="p-2">${a.employee_ids.join(', ')}</td><td class="p-2">${a.work_center_id}</td><td class="p-2">${a.start_slot}</td><td class="p-2">${a.end_slot}</td><td class="p-2">${a.locked?'🔒':''}</td></tr>`).join('');
    document.getElementById('assignTable').innerHTML = `<div class="card"><h3 class="font-semibold mb-2">Proposed Assignments</h3><div class="overflow-x-auto"><table class="w-full text-sm border"><thead class="bg-gray-100"><tr><th class="p-2">Task</th><th class="p-2">Employees</th><th class="p-2">WC</th><th class="p-2">Start</th><th class="p-2">End</th><th class="p-2">Locked</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mt-2"><label class="text-sm">Why this person? Task:</label><select id="whyTask" class="border rounded p-1" onchange="showWhy()">${res.assignments.map(a=>`<option value="${a.task_id}">${a.task_id}</option>`).join('')}</select></div>
    <div id="whyText" class="mt-2 text-sm"></div></div>`;
    window._lastAssign = res.assignments;
    showWhy();
  }
}

function showWhy(){
  const tid = document.getElementById('whyTask').value;
  const a = window._lastAssign.find(x=>x.task_id===tid);
  const skill = a.why.skill_match || {};
  document.getElementById('whyText').innerHTML = `<b>Assigned:</b> ${a.employee_ids.join(', ')} | <b>WC:</b> ${a.work_center_id}<br>
    <b>Skill match:</b> ${Object.entries(skill).map(([e,l])=>e+': level '+l).join(', ')}<br>
    <b>Availability:</b> within shift window on a working day.<br>
    <b>Continuity:</b> ${a.why.continuity?'same person kept':'new assignment'}<br>
    <span class="text-gray-500">Other eligible candidates ranked lower due to workload/skill/overtime.</span>`;
}

// ---------- Gantt ----------
async function renderGantt(){
  const versions = await get('/api/schedules');
  if (!versions.length){ show('<div class="card">No schedule yet. Generate one on AI Allocation Proposal.</div>'); return; }
  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">Schedule Gantt</h2>
    <div class="flex gap-2 mb-3">
      <select id="gVer" class="border rounded p-1">${versions.map(v=>`<option value="${v.id}">${v.id} (${v.status})</option>`).join('')}</select>
      <select id="gView" class="border rounded p-1"><option>Employee</option><option>Work Center</option></select>
      <button class="bg-blue-600 text-white px-3 py-1 rounded" onclick="loadGantt()">Load</button>
    </div>
    <div id="gantt"></div>
    <div id="gTable" class="mt-3"></div>
  </div>`;
  show(html);
}
async function loadGantt(){
  const vid = document.getElementById('gVer').value;
  const view = document.getElementById('gView').value;
  const assigns = await get('/api/schedule/'+vid);
  const meta = await get('/api/meta');
  const hs = new Date(meta.horizon_start);
  // build tasks for frappe-gantt
  const tasks = assigns.map(a=>{
    const start = slotToDate(a.start_slot, hs);
    const end = slotToDate(a.end_slot, hs);
    const name = a.task_id + (a.locked?' 🔒':'');
    const res = view==='Employee' ? a.employee_ids.join(',') : a.work_center_id;
    return {id:a.task_id, name:name, start:start, end:end, progress:0, custom_class: a.locked?'locked':''};
  });
  const el = document.getElementById('gantt');
  el.innerHTML = '';
  if (tasks.length){
    new Gantt(el, tasks, {view_mode:'Day', date_format:'YYYY-MM-DD'});
  }
  // table
  document.getElementById('gTable').innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm border">
    <thead class="bg-gray-100"><tr><th class="p-2">Task</th><th class="p-2">Employees</th><th class="p-2">WC</th><th class="p-2">Start slot</th><th class="p-2">End slot</th><th class="p-2">Locked</th></tr></thead>
    <tbody>${assigns.map(a=>`<tr class="border-t"><td class="p-2">${a.task_id}</td><td class="p-2">${a.employee_ids.join(', ')}</td><td class="p-2">${a.work_center_id}</td><td class="p-2">${a.start_slot}</td><td class="p-2">${a.end_slot}</td><td class="p-2">${a.locked?'🔒':''}</td></tr>`).join('')}</tbody>
  </table></div>`;
}
function slotToDate(slot, hs){
  const day = Math.floor(slot/96);
  const minute = (slot % 96)*15;
  const d = new Date(hs); d.setDate(d.getDate()+day);
  const hh = Math.floor(minute/60); const mm = minute%60;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

// ---------- Approval ----------
async function renderApproval(){

    <label class="text-sm">Version</label><select id="apVer" class="border rounded p-1 mb-2" onchange="loadApproval()">${versions.map(v=>`<option value="${v.id}">${v.id} (${v.status})</option>`).join('')}</select>
    <div id="apTable"></div>

async function loadApproval(){
  const vid = document.getElementById('apVer').value;
  const assigns = await get('/api/schedule/'+vid);
  document.getElementById('apTable').innerHTML = `<div class="overflow-x-auto"><table class="w-full text-sm border">
    <thead class="bg-gray-100"><tr><th class="p-2">Task</th><th class="p-2">Employees</th><th class="p-2">WC</th><th class="p-2">Start</th><th class="p-2">End</th><th class="p-2">Locked</th></tr></thead>
    <tbody>${assigns.map(a=>`<tr class="border-t"><td class="p-2">${a.task_id}</td><td class="p-2">${a.employee_ids.join(', ')}</td><td class="p-2">${a.work_center_id}</td><td class="p-2">${a.start_slot}</td><td class="p-2">${a.end_slot}</td><td class="p-2">${a.locked?'🔒':''}</td></tr>`).join('')}</tbody>
  </table></div>`;
  const sel = document.getElementById('apTask');
  sel.innerHTML = assigns.map(a=>`<option value="${a.task_id}">${a.task_id}</option>`).join('');
  await updateCandidateList();
  sel.onchange = updateCandidateList;
}

async function updateCandidateList(){
  const tid = document.getElementById('apTask').value;
  const er = await get('/api/eligibility/'+tid);
  const emps = (await get('/api/workforce'));
  const byId = Object.fromEntries(emps.map(e=>[e.id,e]));
  const sel = document.getElementById('apEmp');
  sel.innerHTML = er.candidates.map(c=>`<option value="${c.employee_id}">${byId[c.employee_id].name} (lvl ${c.skill_level})</option>`).join('');
}

async function doReassign(){
  const vid=document.getElementById('apVer').value; const tid=document.getElementById('apTask').value;
  const emp=document.getElementById('apEmp').value; const reason=document.getElementById('apReason').value;
  const res=await post('/api/reassign',{version_id:vid,task_id:tid,employee_id:emp,reason});
  document.getElementById('apMsg').innerHTML = res.ok?'Reassigned.':'Error';
  if(res.ok) loadApproval();
}
async function doLock(){
  const vid=document.getElementById('apVer').value; const tid=document.getElementById('apTask').value;
  await post('/api/lock',{version_id:vid,task_id:tid,reason:document.getElementById('apReason').value});
  document.getElementById('apMsg').innerHTML='Locked 🔒'; loadApproval();
}
async function doUnlock(){
  const vid=document.getElementById('apVer').value; const tid=document.getElementById('apTask').value;
  const res=await post('/api/unlock',{version_id:vid,task_id:tid,reason:document.getElementById('apReason').value});
  document.getElementById('apMsg').innerHTML = res.ok?'Unlocked.':(res.detail||'Error (role?)'); loadApproval();
}
async function doApprove(){
  const vid=document.getElementById('apVer').value;
  await post('/api/approve',{version_id:vid}); document.getElementById('apMsg').innerHTML='Approved.'; loadApproval();
}
async function doReject(){
  const vid=document.getElementById('apVer').value;
  await post('/api/reject',{version_id:vid,reason:document.getElementById('apReason').value||'rejected'});
  document.getElementById('apMsg').innerHTML='Rejected.'; loadApproval();
}

async function renderMyTasks(){

  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">My Tasks</h2>
    <p class="text-gray-600 mb-3">Your assigned tasks, shift, due time. Large buttons.</p>
    <label class="text-sm">Employee</label><select id="mtEmp" class="border rounded p-1 mb-3" onchange="loadMyTasks()">${emps.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select>
    <div id="mtList"></div>
  </div>`;
  show(html);
  loadMyTasks();
}
async function loadMyTasks(){
  const eid = document.getElementById('mtEmp').value;
  const tasks = await get('/api/tasks');
  const mine = tasks.filter(t=>{ try{return JSON.parse(t.employee_ids||'[]').includes(eid);}catch{return false;} });
  const div = document.getElementById('mtList');
  if (!mine.length){ div.innerHTML='<p class="text-gray-500">No tasks assigned.</p>'; return; }
  div.innerHTML = mine.map(t=>`
    <div class="card">
      <div class="font-semibold">${t.name}</div>
      <div class="text-sm text-gray-500">Order ${t.order_id} | ${t.duration_min} min | Status: ${t.status}</div>
      <div class="mt-2 flex gap-2">
        <button class="bg-blue-600 text-white px-4 py-2 rounded" onclick="setStatus('${t.id}','In Progress')">Start</button>
        <button class="bg-green-600 text-white px-4 py-2 rounded" onclick="setStatus('${t.id}','Completed')">Complete</button>
        <button class="bg-red-600 text-white px-4 py-2 rounded" onclick="setStatus('${t.id}','Blocked')">Report Issue</button>
      </div>
    </div>`).join('');
}
async function setStatus(tid,status){ await post('/api/tasks/'+tid+'/status',{status}); loadMyTasks(); }

// ---------- Progress ----------
async function renderProgress(){
  const alerts = await get('/api/alerts');
  document.getElementById('alertBadge').textContent = alerts.count;
  const tasks = await get('/api/tasks');
  let html = `<div class="card"><h2 class="text-xl font-bold mb-2">Live Progress and Alerts</h2>
    <p class="text-gray-600 mb-3">Delivery-risk dashboard, alerts, replanning simulator.</p>
    <h3 class="font-semibold mb-2">Alerts (${alerts.count} unread)</h3>
    <div class="mb-3">${alerts.items.slice(0,20).map(a=>`<div class="text-sm">${a.severity==='critical'?'🔴':a.severity==='warning'?'🟡':'🔵'} ${a.ts} - ${a.message}</div>`).join('')||'<p class="text-gray-500">No alerts.</p>'}</div>
    <div class="metric mb-3">Total tasks: ${tasks.length} | Completed: ${tasks.filter(t=>t.status==='Completed').length} | Blocked: ${tasks.filter(t=>t.status==='Blocked').length}</div>
  </div>`;

  html += `<div class="card"><h3 class="font-semibold mb-2">Replanning simulator</h3>
    <div class="flex gap-2 mb-2">
      <select id="evType" class="border rounded p-1" onchange="evFields()">
        <option value="absence">absence</option><option value="breakdown">breakdown</option>
        <option value="delay">delay</option><option value="new_order">new_order</option>
        <option value="priority_change">priority_change</option>
      </select>
    </div>
    <div id="evFields"></div>
    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded" onclick="simulate()">Simulate and propose revised plan</button>
    <div id="simResult" class="mt-3 text-sm"></div>
  </div>`;

  html += `<div class="card"><h3 class="font-semibold mb-2">Simulate impossible case</h3>
    <p class="text-sm text-gray-500">All certified 5-axis staff absent.</p>
    <button class="bg-red-600 text-white px-4 py-2 rounded" onclick="impossible()">Run impossible case</button>
    <div id="impResult" class="mt-2 text-sm"></div>
  </div>`;
  show(html);
  evFields();
}

function evFields(){
  const t = document.getElementById('evType').value;
  const emps = []; const wcs=[]; const orders=[];
  // fetch synchronously-ish via cached? We'll render placeholders and fill
  get('/api/workforce').then(es=>{
    get('/api/orders').then(os=>{
      const div = document.getElementById('evFields');
      if (t==='absence') div.innerHTML = `<label class="text-sm">Absent employee</label><select id="evEmp" class="border rounded p-1 w-full">${es.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select>`;
      else if (t==='breakdown'){ get('/api/workforce'); div.innerHTML = `<label class="text-sm">Broken work center</label><select id="evWc" class="border rounded p-1 w-full">${['TC-1','TC-2','VMC-1','VMC-2','5AX-1','FIN-1','QC-1','PK-1'].map(w=>`<option>${w}</option>`).join('')}</select>`; }
      else if (t==='delay') div.innerHTML = `<label class="text-sm">Delayed task</label><select id="evTask" class="border rounded p-1 w-full"></select><label class="text-sm">Delay hours</label><input id="evHours" type="number" value="2" class="border rounded p-1 w-full">`;
      else if (t==='new_order') div.innerHTML = `<label class="text-sm">New urgent order</label><select id="evOrder" class="border rounded p-1 w-full">${os.map(o=>`<option value="${o.id}">${o.id}</option>`).join('')}</select>`;
      else if (t==='priority_change') div.innerHTML = `<label class="text-sm">Order</label><select id="evOrder" class="border rounded p-1 w-full">${os.map(o=>`<option value="${o.id}">${o.id}</option>`).join('')}</select><label class="text-sm">New priority</label><select id="evPrio" class="border rounded p-1 w-full"><option>Urgent</option><option>High</option><option>Normal</option></select>`;
    });
  });
}

async function buildEvent(){
  const t = document.getElementById('evType').value;
  const ev = {type: t};
  if (t==='absence') ev.employee_id = document.getElementById('evEmp').value;
  else if (t==='breakdown') ev.work_center_id = document.getElementById('evWc').value;
  else if (t==='delay'){ ev.task_id=document.getElementById('evTask').value; ev.hours=parseInt(document.getElementById('evHours').value); }
  else if (t==='new_order') ev.order_id = document.getElementById('evOrder').value;
  else if (t==='priority_change'){ ev.order_id=document.getElementById('evOrder').value; ev.priority=document.getElementById('evPrio').value; }
  return ev;
}

async function simulate(){
  const ev = await buildEvent();
  const res = await post('/api/replan', {event: ev});
  const div = document.getElementById('simResult');
  if (res.requires_unlock){ div.innerHTML = `<span class="text-red-600">Locked conflicts: ${JSON.stringify(res.conflicts)}</span>`; return; }
  if (res.diff){
    div.innerHTML = `<div class="text-green-600">Revised plan ${res.new_version_id} proposed (${res.solver_status}).</div>
      <div><b>Moved:</b> ${JSON.stringify(res.diff.moved)}</div>
      <div><b>Shifted:</b> ${JSON.stringify(res.diff.shifted)}</div>
      <button class="mt-2 bg-green-600 text-white px-3 py-1 rounded" onclick="approveReplan('${res.new_version_id}')">Approve revised plan</button>`;
  } else {
    div.innerHTML = `<span class="text-amber-600">${res.solver_status||'No diff'} ${res.zero_eligibility? 'Zero-elig: '+res.zero_eligibility.join(', '):''}</span>`;
  }
}
async function approveReplan(vid){ await post('/api/approve',{version_id:vid}); alert('Approved.'); render(); }
async function impossible(){
  const res = await post('/api/replan', {event:{type:'impossible'}});
  document.getElementById('impResult').innerHTML = `<div>Solver: ${res.status}</div><div>Zero-eligibility: ${(res.zero_eligibility||[]).join(', ')}</div><div class="text-gray-500">${res.message}</div>`;
}
